<!doctype html>
<html><head><meta charset="utf-8"><title>Reason icons</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style></head>
<body><canvas id="cv"></canvas>
<script>
// The pictures of the drop reason plate (KnoxDragLayer, the style "Чертёж"
// chosen by the author 2026-10-28), drawn here as in the approved mockup
// (.claude/mockups/drop_reason/icons_v2.html) and cut into textures by make.py.
// Each picture at each size in two layers, white on black (make.py takes the
// light for alpha): "base" (lines, the dot, the dim fill) and "mark" (the red
// part). One row per size: far base, far mark, full base, full mark, grow base,
// grow mark, each in a cell of CELL px.
const SIZES = [20, 22, 24, 26, 28, 30, 32, 36, 40, 44, 48, 56, 64];
const CELL = 72;
const PIC = {
  // the character (a dot), a cupboard far off, a red dashed way between
  far: [['dot', 'M4.5 12 m-3 0 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0'],
        ['line', 'M15.5 3 H22.5 V21 H15.5 Z M15.5 9 H22.5 M15.5 15 H22.5'],
        ['dash', 'M8 12 H14.5']],
  // a full grid, and a piece left over it with no cell to go to
  full: [['fill', 'M2 7.5 H16 V21.5 H2 Z'], ['line', 'M2 7.5 H16 V21.5 H2 Z M6.67 7.5 V21.5 M11.33 7.5 V21.5 M2 12.17 H16 M2 16.83 H16'],
         ['mark', 'M14 1.5 H22 V9.5 H14 Z']],
  full2: [['fill', 'M2 7.5 H17 V21.5 H2 Z'], ['line', 'M2 7.5 H17 V21.5 H2 Z M9.5 7.5 V21.5 M2 14.5 H17'],
          ['mark', 'M15 1.5 H22.5 V9 H15 Z']],
  // a bag between two walls, pushing at both
  grow: [['line', 'M1.5 3 V21 M22.5 3 V21'],
         ['line', 'M10.2 7 C10.2 4.6 13.8 4.6 13.8 7 M9.6 7.5 C8.4 7.5 8 8.6 8 10 V17.4 C8 18.6 8.6 19.2 9.6 19.2 H14.4 C15.4 19.2 16 18.6 16 17.4 V10 C16 8.6 15.6 7.5 14.4 7.5 Z'],
         ['mark', 'M7 13.5 H4.5 M17 13.5 H19.5'],
         ['markFill', 'M2.6 13.5 L5.6 10.6 L5.6 16.4 Z M21.4 13.5 L18.4 10.6 L18.4 16.4 Z']],
};
const RED = {mark: true, markFill: true, dash: true};
const cv = document.getElementById('cv'), g = cv.getContext('2d');
// one layer of a picture at size s with its box's corner at x, y
function layer(name, x, y, s, red) {
  if (name === 'full' && s < 28) name = 'full2';   // (a 3x3 grid is mush at 720)
  const k = s / 24, lw = Math.max(1, Math.round(s / 14)), o = lw % 2 ? 0.5 : 0;
  g.save(); g.translate(x + o, y + o); g.scale(k, k); g.lineWidth = lw / k; g.lineCap = 'round'; g.lineJoin = 'round';
  for (const [kind, d] of PIC[name]) {
    if (!!RED[kind] !== red) continue;
    const p = new Path2D(d);
    if (kind === 'fill') { g.fillStyle = 'rgba(255,255,255,0.25)'; g.fill(p); }
    else if (kind === 'dot' || kind === 'markFill') { g.fillStyle = '#fff'; g.fill(p); }
    else if (kind === 'dash') {
      // (solid when small: dashes of 2 px vanish at 720)
      g.setLineDash(s < 28 ? [] : [2.6, 1.6]); g.lineCap = 'butt'; g.strokeStyle = '#fff'; g.stroke(p); g.setLineDash([]); g.lineCap = 'round';
    } else { g.strokeStyle = '#fff'; g.stroke(p); }
  }
  g.restore();
}
cv.width = CELL * 6; cv.height = CELL * SIZES.length;
g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
SIZES.forEach((s, j) => ['far', 'full', 'grow'].forEach((name, i) => {
  layer(name, (i * 2) * CELL + 4, j * CELL + 4, s, false);
  layer(name, (i * 2 + 1) * CELL + 4, j * CELL + 4, s, true);
}));
document.body.dataset.ready = '1';
</script></body></html>
